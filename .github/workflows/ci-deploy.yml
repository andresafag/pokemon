name: CI & Deploy to ECS

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - ".github/workflows/ci-deploy.yml"
      - "infrastructure/terraform/**"
      - ".aws/**"
      - "Dockerfile.collector"
  repository_dispatch:
    types: [agent_redeploy_trigger]

concurrency:
  group: "ci-deploy"
  cancel-in-progress: true

permissions:
  contents: read 

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Test
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        if: ${{ github.event_name == 'push' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/package-lock.json
        

      - name: Install dependencies
        if: ${{ github.event_name == 'push' }}
        run: npm ci
        working-directory: src

      - name: Syntax check JS files
        if: ${{ github.event_name == 'push' }}
        run: |
          node --check src/server.js
          node --check src/public/axi.js

      - name: Start server and smoke-test
        if: ${{ github.event_name == 'push' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          nohup npm start &
          sleep 3
          curl --fail --silent --show-error http://localhost:10000/
        working-directory: src

  # ---------------------------------------------------------------------------
  # Job 2 — Build, push, and deploy 
  # ---------------------------------------------------------------------------
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: write
      id-token: write

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      ECR_COLLECTOR_REPOSITORY: ${{ secrets.ECR_COLLECTOR_REPOSITORY }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      CONTAINER_NAME: pokemon
      TASK_DEFINITION_PATH: .aws/task-definition.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------------
      # Log in to ECR 
      # ------------------------------------------------------------------
      - name: src folder cache
        id: src-cache
        uses: actions/cache@v4
        with:
          path: |
            src/**
          key: ${{ runner.os }}-src-${{ hashFiles('src/**') }}
      
      - name: Log in to Amazon ECR 
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------
      # Build, tag (commit SHA + latest), and push ARM64 image
      # ------------------------------------------------------------------
      - name: Build and push App Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push OTel Collector Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collector
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_COLLECTOR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_COLLECTOR_REPOSITORY }}:latest
          build-args: |
            EXPORTER_IP=${{ secrets.OTEL_EXPORTER_IP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max 

      # ------------------------------------------------------------------
      # Render the new image URIs into the task-definition template.
      # ------------------------------------------------------------------
      - name: Render app container into task definition
        id: render-app
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_PATH }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Render collector container into task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-app.outputs.task-definition }}
          container-name: otel-collector
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_COLLECTOR_REPOSITORY }}:${{ github.sha }}

      # ------------------------------------------------------------------
      # Register the rendered task definition and update the ECS service.
      # ------------------------------------------------------------------
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
      
      - name: Fetch and update AWS Public IP
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster pokemon-cluster --service-name pokemon --desired-status RUNNING --query "taskArns | [-1]" --output text)
          ENI_ID=$(aws ecs describe-tasks --cluster pokemon-cluster --tasks $TASK_ARN --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
          
          PUBLIC_IP="None"
          for i in {1..12}; do
            PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI_ID --query "NetworkInterfaces[0].Association.PublicIp" --output text)
            if [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != "None" ]; then
              echo "Successfully found Public IP: $PUBLIC_IP"
              break
            fi
            echo "Public IP not ready yet. Retrying in 5 seconds... ($i/12)"
            sleep 5
          done

          if [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != "None" ]; then
            # Updates the IP address in your README file dynamically
            sed -i -E "s|(http://)[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(:10000)|\1${PUBLIC_IP}\2|g" README.md
          else
            echo "Error: Could not retrieve a valid Public IP."
            exit 1
          fi


      - name: Generate Feature Summary with AI
        id: ai_summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # 1. Comprobar de forma segura si existe el commit padre (HEAD~1)
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "Previous commit found. Running diff against HEAD~1..."
            GIT_DIFF=$(git diff HEAD~1 HEAD -- . ':!README.md')
          else
            echo "No previous commit found. Running diff on current commit using git show..."
            GIT_DIFF=$(git show HEAD -- . ':!README.md')
          fi

          # Fallback por si el commit solo contenía cambios del README.md
          if [ -z "$GIT_DIFF" ]; then
            GIT_DIFF="No code changes. Only documentation or configuration updates."
          fi

          # 2. CONSTRUCCIÓN SEGURA DEL JSON: jq se encarga de escapar todo perfectamente
          jq -n \
            --arg diff "$GIT_DIFF" \
            --arg system_prompt "You are a technical documentation assistant. Read the provided git diff and write a clean, single-sentence summary of the new feature or improvement added. Start with a markdown bullet point like '- **Feature Name**: Brief description.' Do not include any other conversational filler text." \
            '{
              model: "deepseek-flash",
              messages: [
                {role: "system", content: $system_prompt},
                {role: "user", content: $diff}
              ]
            }' > deepseek_request.json

          # 3. Llamada a la API usando el archivo JSON y simulando un navegador web (User-Agent)
          curl -s https://deepseek.com \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -d @deepseek_request.json > deepseek_response.json

          # 4. Mostrar la respuesta en los logs de GitHub Actions por si necesitas depurar
          echo "=== RESPUESTA COMPLETA DE DEEPSEEK ==="
          cat deepseek_response.json
          echo "======================================"

          # 5. Extraer el texto del JSON capturando correctamente la primera opción con jq
          FEATURE_DESC=$(jq -r '.choices[0].message.content' deepseek_response.json)

          # 6. Escribir en el README.md solo si la respuesta de la IA no es nula o vacía
          if [ -n "$FEATURE_DESC" ] && [ "$FEATURE_DESC" != "null" ]; then
            echo -e "\n### Recent Updates\n$FEATURE_DESC" >> README.md
            echo "README updated successfully with AI summary."
          else
            echo "Error: DeepSeek API returned an empty or invalid response."
            exit 1
          fi

      - name: Commit and Push Changes back to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update README with AI feature summary [skip ci]"
          file_pattern: 'README.md'
          push_options: '--force-with-lease'