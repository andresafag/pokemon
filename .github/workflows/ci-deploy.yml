name: CI & Deploy to ECS

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - ".github/workflows/ci-deploy.yml"
      - "infrastructure/terraform/**"
      - ".aws/**"
      - "Dockerfile.collector"

concurrency:
  group: "ci-deploy"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Test
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/package-lock.json
        

      - name: Install dependencies
        run: npm ci
        working-directory: src

      - name: Syntax check JS files
        run: |
          node --check src/server.js
          node --check src/public/axi.js

      - name: Start server and smoke-test
        run: |
          nohup npm start &
          sleep 3
          curl --fail --silent --show-error http://localhost:10000/
        working-directory: src

  # ---------------------------------------------------------------------------
  # Job 2 — Build, push, and deploy 
  # ---------------------------------------------------------------------------
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test

    # Required for OIDC token issuance (id-token) and ECR login (packages: write
    # is not needed here — id-token + contents:read is sufficient for AWS OIDC).
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      ECR_COLLECTOR_REPOSITORY: ${{ secrets.ECR_COLLECTOR_REPOSITORY }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      CONTAINER_NAME: pokemon
      TASK_DEFINITION_PATH: .aws/task-definition.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------------
      # Log in to ECR 
      # ------------------------------------------------------------------
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------
      # Build, tag (commit SHA + latest), and push ARM64 image
      # ------------------------------------------------------------------
      - name: Build and push Docker image (ARM64)
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Build, tag, and push the OTel Collector sidecar image (ARM64).
      # Uses Dockerfile.collector which bakes open-config.yml into the
      # official otel/opentelemetry-collector-contrib base image.
      # ------------------------------------------------------------------
      - name: Build and push OTel Collector sidecar image (ARM64)
        id: build-collector
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COLLECTOR_URI="${ECR_REGISTRY}/${ECR_COLLECTOR_REPOSITORY}:${IMAGE_TAG}"

          docker buildx build \
            --platform linux/arm64 \
            --push \
            -f Dockerfile.collector \
            -t "${COLLECTOR_URI}" \
            -t "${ECR_REGISTRY}/${ECR_COLLECTOR_REPOSITORY}:latest" \
            .

          echo "collector_uri=${COLLECTOR_URI}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Render the new image URIs into the task-definition template.
      # Step 1: replace IMAGE_URI_PLACEHOLDER for the app container.
      # Step 2: replace COLLECTOR_IMAGE_URI_PLACEHOLDER for the sidecar.
      # ------------------------------------------------------------------
      - name: Render app container into task definition
        id: render-app
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_PATH }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image_uri }}

      - name: Render collector container into task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-app.outputs.task-definition }}
          container-name: otel-collector
          image: ${{ steps.build-collector.outputs.collector_uri }}

      # ------------------------------------------------------------------
      # Register the rendered task definition and update the ECS service.
      # The service lifecycle block in Terraform (ignore_changes) ensures
      # Terraform will never roll this back.
      # ------------------------------------------------------------------
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
