name: CI & Deploy to ECS

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - ".github/workflows/ci-deploy.yml"
      - "infrastructure/terraform/**"
      - ".aws/**"
      - "Dockerfile.collector"

concurrency:
  group: "ci-deploy"
  cancel-in-progress: true

permissions:
  contents: read 

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Test
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/package-lock.json
        

      - name: Install dependencies
        run: npm ci
        working-directory: src

      - name: Syntax check JS files
        run: |
          node --check src/server.js
          node --check src/public/axi.js

      - name: Start server and smoke-test
        run: |
          nohup npm start &
          sleep 3
          curl --fail --silent --show-error http://localhost:10000/
        working-directory: src

  # ---------------------------------------------------------------------------
  # Job 2 — Build, push, and deploy 
  # ---------------------------------------------------------------------------
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04-arm
    needs: test

    # Required for OIDC token issuance (id-token) and ECR login (packages: write
    permissions:
      contents: write
      id-token: write

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      ECR_COLLECTOR_REPOSITORY: ${{ secrets.ECR_COLLECTOR_REPOSITORY }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      CONTAINER_NAME: pokemon
      TASK_DEFINITION_PATH: .aws/task-definition.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------------
      # Log in to ECR 
      # ------------------------------------------------------------------
      - name: src folder cache
        id: src-cache
        uses: actions/cache@v4
        with:
          path: |
            src/**
          key: ${{ runner.os }}-src-${{ hashFiles('src/**') }}
      
      - name: Log in to Amazon ECR 
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------
      # Build, tag (commit SHA + latest), and push ARM64 image
      # ------------------------------------------------------------------
      - name: Build and push App Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push OTel Collector Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collector
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_COLLECTOR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_COLLECTOR_REPOSITORY }}:latest
          build-args: |
            EXPORTER_IP=${{ secrets.OTEL_EXPORTER_IP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # Render the new image URIs into the task-definition template.
      # ------------------------------------------------------------------
      - name: Render app container into task definition
        id: render-app
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_PATH }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Render collector container into task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-app.outputs.task-definition }}
          container-name: otel-collector
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_COLLECTOR_REPOSITORY }}:${{ github.sha }}

      # ------------------------------------------------------------------
      # Register the rendered task definition and update the ECS service.
      # ------------------------------------------------------------------
      - name: Deploy to Amazon ECS
        if: steps.src-cache.outputs.cache-hit != 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
        
